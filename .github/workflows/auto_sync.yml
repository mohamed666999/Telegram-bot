name: نقل البيانات إلى حساب Railway الجديد

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: تثبيت الأدوات
        run: sudo apt-get update && sudo apt-get install -y postgresql-client curl jq

      - name: تنفيذ النقل
        env:
          TOKEN_OLD: "3cbaa6a7-b05c-4bc6-9201-963d7a5d69de"
          TOKEN_NEW: "7a636198-3023-4804-92e7-a111acf5f22e"
          PROJ1_OLD: "8d780eb4-dde8-41cf-bfc1-4a4030d209ca"
          PROJ2_OLD: "a10557f9-6021-46c5-834b-d555dccc9410"
          PROJ3_OLD: "3b788d03-2c44-4bcf-8923-8235fd3f30e0"
        run: |
          set -e

          # دالة لاستدعاء GraphQL
          graphql() {
            curl -s -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $1" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"$2\"}"
          }

          # الحصول على رابط قاعدة البيانات من معرف المشروع
          get_db_url() {
            local token=$1 proj=$2
            local svc_id=$(graphql "$token" "query { project(id: \"$proj\") { services { edges { node { id plugin } } } } }" | jq -r '.data.project.services.edges[] | select(.node.plugin=="postgresql") | .node.id' | head -1)
            if [ -z "$svc_id" ]; then
              echo "❌ لم أجد PostgreSQL في المشروع $proj" >&2
              exit 1
            fi
            graphql "$token" "query { service(id: \"$svc_id\") { variables { edges { node { name value } } } } }" | jq -r '.data.service.variables.edges[] | select(.node.name=="DATABASE_PUBLIC_URL") | .node.value'
          }

          # إنشاء مشروع جديد في الحساب الجديد
          create_project() {
            local token=$1 name=$2
            graphql "$token" "mutation { projectCreate(input: { name: \"$name\" }) { project { id } } }" | jq -r '.data.projectCreate.project.id'
          }

          # إضافة PostgreSQL إلى مشروع
          add_postgres() {
            local token=$1 proj=$2
            graphql "$token" "mutation { serviceCreate(input: { projectId: \"$proj\", name: \"postgres\", plugin: \"postgresql\" }) { service { id } } }" | jq -r '.data.serviceCreate.service.id'
          }

          echo "🔍 جلب روابط قواعد البيانات القديمة..."
          OLD_URL1=$(get_db_url "$TOKEN_OLD" "$PROJ1_OLD")
          OLD_URL2=$(get_db_url "$TOKEN_OLD" "$PROJ2_OLD")
          OLD_URL3=$(get_db_url "$TOKEN_OLD" "$PROJ3_OLD")
          echo "✅ تم الحصول على الروابط القديمة"

          echo "🚀 إنشاء مشاريع جديدة في الحساب الثاني..."
          NEW_IDS=()
          for i in 1 2 3; do
            NAME="new_proj_${i}_$(date +%s)"
            ID=$(create_project "$TOKEN_NEW" "$NAME")
            NEW_IDS+=("$ID")
            echo "✅ مشروع $i: $NAME (ID: $ID)"
            echo "📦 إضافة PostgreSQL إلى المشروع $i..."
            add_postgres "$TOKEN_NEW" "$ID"
            sleep 2
          done

          echo "⏳ انتظار جاهزية قواعد البيانات الجديدة..."
          NEW_URLS=()
          for id in "${NEW_IDS[@]}"; do
            # انتظر حتى تظهر المتغيرات
            for attempt in {1..30}; do
              URL=$(get_db_url "$TOKEN_NEW" "$id" 2>/dev/null || true)
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                NEW_URLS+=("$URL")
                echo "✅ رابط قاعدة البيانات الجديدة: $URL"
                break
              fi
              echo "⏳ المحاولة $attempt ..."
              sleep 3
            done
            if [ ${#NEW_URLS[@]} -lt ${#NEW_IDS[@]} ]; then
              echo "❌ فشل الحصول على رابط قاعدة البيانات للمشروع $id"
              exit 1
            fi
          done

          echo "🔄 بدء نقل البيانات..."
          pg_dump --clean --if-exists --no-owner --no-privileges "$OLD_URL1" > dump1.sql
          psql "${NEW_URLS[0]}" < dump1.sql
          echo "✅ تم نقل المشروع 1"

          pg_dump --clean --if-exists --no-owner --no-privileges "$OLD_URL2" > dump2.sql
          psql "${NEW_URLS[1]}" < dump2.sql
          echo "✅ تم نقل المشروع 2"

          pg_dump --clean --if-exists --no-owner --no-privileges "$OLD_URL3" > dump3.sql
          psql "${NEW_URLS[2]}" < dump3.sql
          echo "✅ تم نقل المشروع 3"

          echo "🎉 اكتمل النقل بنجاح!"
          echo "روابط قواعد البيانات الجديدة:"
          for i in "${!NEW_URLS[@]}"; do
            echo "  قاعدة $((i+1)): ${NEW_URLS[$i]}"
          done
