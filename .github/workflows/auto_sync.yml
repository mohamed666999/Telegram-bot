name: 🚨 Emergency Database Rescue

on:
  workflow_dispatch: # لتشغيل الكود يدوياً بضغطة زر

jobs:
  rescue_data:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Transfer Data Safely
        env:
          OLD_URL: ${{ secrets.OLD_DB_URL }}
          NEW_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          echo "🔄 جاري الاتصال بالحساب القديم وسحب الجداول..."
          
          # هذا الأمر السحري ينسخ كل شيء (الجداول، البيانات، الهيكلة) ويصبها في الحساب الجديد
          
          pg_dump --clean --if-exists --no-owner --no-privileges "$OLD_URL" | psql "$NEW_URL"
          echo "🎉 مبروك! تمت عملية الإنقاذ بنجاح. بياناتك الآن آمنة في الحساب الجديد."
