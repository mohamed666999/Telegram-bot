name: Smart DB Rotation (3 Projects)

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client curl jq

      - name: Rotate and sync
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          START_DATE: "2025-03-01"   # غيّر هذا إلى تاريخ بدء المشروع الأول
        run: |
          # حساب اليوم في الدورة (كل 45 يوم = 3 حسابات × 15 يوم)
          NOW=$(date +%s)
          START=$(date -d "$START_DATE" +%s)
          DAYS=$(( (NOW - START) / 86400 ))
          CYCLE_DAY=$(( DAYS % 45 ))

          echo "📅 اليوم $CYCLE_DAY من الدورة"

          # تحديد المصدر والهدف حسب اليوم
          if [ "$CYCLE_DAY" -eq 14 ]; then
            SOURCE_ID="${{ secrets.PROJECT1_ID }}"
            TARGET_ID="${{ secrets.PROJECT2_ID }}"
            echo "🔁 اليوم 14: نقل من المشروع 1 إلى 2"
          elif [ "$CYCLE_DAY" -eq 29 ]; then
            SOURCE_ID="${{ secrets.PROJECT2_ID }}"
            TARGET_ID="${{ secrets.PROJECT3_ID }}"
            echo "🔁 اليوم 29: نقل من المشروع 2 إلى 3"
          elif [ "$CYCLE_DAY" -eq 44 ]; then
            SOURCE_ID="${{ secrets.PROJECT3_ID }}"
            TARGET_ID="${{ secrets.PROJECT1_ID }}"
            echo "🔁 اليوم 44: نقل من المشروع 3 إلى 1"
          else
            echo "✅ لا حاجة للمزامنة اليوم"
            exit 0
          fi

          # الحصول على رابط قاعدة البيانات من المشروع المصدر
          echo "🔍 جلب رابط المصدر..."
          SOURCE_URL=$(get_db_url "$SOURCE_ID")
          echo "🔍 جلب رابط الهدف..."
          TARGET_URL=$(get_db_url "$TARGET_ID")

          echo "📤 بدء نقل البيانات..."
          pg_dump --clean --if-exists --no-owner --no-privileges "$SOURCE_URL" > dump.sql
          psql "$TARGET_URL" < dump.sql
          echo "✅ تم نقل البيانات بنجاح"

# دالة مساعدة لجلب رابط PostgreSQL من مشروع معين
get_db_url() {
  local project_id=$1
  # استعلم عن أول خدمة PostgreSQL في المشروع
  service_id=$(curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
    -H "Content-Type: application/json" \
    -d "{\"query\":\"query { project(id: \\\"$project_id\\\") { services { edges { node { id plugin } } } } }\"}" \
    https://backboard.railway.com/graphql/v2 | jq -r '.data.project.services.edges[] | select(.node.plugin=="postgresql") | .node.id' | head -1)

  if [ -z "$service_id" ]; then
    echo "❌ لم يتم العثور على PostgreSQL في المشروع $project_id"
    exit 1
  fi

  # احصل على متغير DATABASE_PUBLIC_URL لهذه الخدمة
  url=$(curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
    -H "Content-Type: application/json" \
    -d "{\"query\":\"query { service(id: \\\"$service_id\\\") { variables { edges { node { name value } } } } }\"}" \
    https://backboard.railway.com/graphql/v2 | jq -r '.data.service.variables.edges[] | select(.node.name=="DATABASE_PUBLIC_URL") | .node.value')

  echo "$url"
}
