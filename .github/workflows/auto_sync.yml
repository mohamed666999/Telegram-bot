name: 🚨 Emergency Database Rescue

on:
  workflow_dispatch:

jobs:
  rescue_data:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Transfer Data Safely
        env:
          OLD_URL: ${{ secrets.OLD_DB_URL }}
          NEW_URL: ${{ secrets.NEW_DB_URL }}
        run: |
          echo "🔄 Starting database migration..."

          if [ -z "$OLD_URL" ] || [ -z "$NEW_URL" ]; then
            echo "❌ Missing database URLs!"
            exit 1
          fi

          pg_dump --verbose --clean --if-exists --no-owner --no-privileges "$OLD_URL" | psql "$NEW_URL"

          echo "✅ Migration completed!"
