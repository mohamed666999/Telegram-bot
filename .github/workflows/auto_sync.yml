name: Auto Migrate All Databases to New Account

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client curl jq

      - name: Run migration
        env:
          # التوكنات ومعرفات المشاريع (مضمنة مباشرة)
          OLD_TOKEN: "3cbaa6a7-b05c-4bc6-9201-963d7a5d69de"
          NEW_TOKEN: "7a636198-3023-4804-92e7-a111acf5f22e"
          OLD_PROJ1: "8d780eb4-dde8-41cf-bfc1-4a4030d209ca"
          OLD_PROJ2: "a10557f9-6021-46c5-834b-d555dccc9410"
          OLD_PROJ3: "3b788d03-2c44-4bcf-8923-8235fd3f30e0"
        run: |
          set -e

          # دالة لتنفيذ استعلام GraphQL
          graphql() {
            local token=$1
            local query=$2
            curl -s -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data-binary "$(jq -n --arg q "$query" '{query: $q}')"
          }

          # دالة لإنشاء مشروع جديد
          create_project() {
            local token=$1
            local name=$2
            local query="mutation { projectCreate(input: { name: \"$name\" }) { project { id name } } }"
            graphql "$token" "$query" | jq -r '.data.projectCreate.project.id'
          }

          # دالة لإنشاء خدمة PostgreSQL داخل مشروع
          create_postgres_service() {
            local token=$1
            local project_id=$2
            local query="mutation { serviceCreate(input: { projectId: \"$project_id\", name: \"postgres\", plugin: \"postgresql\" }) { service { id } } }"
            graphql "$token" "$query" | jq -r '.data.serviceCreate.service.id'
          }

          # دالة لجلب رابط قاعدة البيانات (تنتظر حتى تصبح جاهزة)
          get_db_url() {
            local token=$1
            local project_id=$2
            local max_attempts=20
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              local query="query { project(id: \"$project_id\") { services { edges { node { id plugin } } } } }"
              local service_id
              service_id=$(graphql "$token" "$query" | jq -r '.data.project.services.edges[] | select(.node.plugin=="postgresql") | .node.id' | head -1)
              if [ -n "$service_id" ]; then
                local url_query="query { service(id: \"$service_id\") { variables { edges { node { name value } } } } }"
                local url
                url=$(graphql "$token" "$url_query" | jq -r '.data.service.variables.edges[] | select(.node.name=="DATABASE_PUBLIC_URL") | .node.value')
                if [ -n "$url" ] && [ "$url" != "null" ]; then
                  echo "$url"
                  return 0
                fi
              fi
              echo "⏳ انتظار جاهزية قاعدة البيانات... ($attempt/$max_attempts)"
              sleep 5
              attempt=$((attempt+1))
            done
            echo "❌ فشل الحصول على رابط قاعدة البيانات بعد $max_attempts محاولة"
            exit 1
          }

          # روابط قواعد البيانات القديمة
          echo "🔍 جلب روابط قواعد البيانات القديمة..."
          OLD_URL1=$(get_db_url "$OLD_TOKEN" "$OLD_PROJ1")
          OLD_URL2=$(get_db_url "$OLD_TOKEN" "$OLD_PROJ2")
          OLD_URL3=$(get_db_url "$OLD_TOKEN" "$OLD_PROJ3")
          echo "✅ رابط 1: $OLD_URL1"
          echo "✅ رابط 2: $OLD_URL2"
          echo "✅ رابط 3: $OLD_URL3"

          # إنشاء 3 مشاريع جديدة في الحساب الجديد
          echo "🚀 إنشاء مشاريع جديدة..."
          NEW_IDS=()
          for i in 1 2 3; do
            PROJ_NAME="new_project_${i}_$(date +%s)"
            NEW_ID=$(create_project "$NEW_TOKEN" "$PROJ_NAME")
            NEW_IDS+=("$NEW_ID")
            echo "✅ تم إنشاء مشروع $i: $PROJ_NAME (ID: $NEW_ID)"
            
            echo "📦 إنشاء قاعدة بيانات PostgreSQL في المشروع $i..."
            create_postgres_service "$NEW_TOKEN" "$NEW_ID"
            sleep 2
          done

          # انتظار جاهزية قواعد البيانات الجديدة
          echo "⏳ انتظار جاهزية قواعد البيانات الجديدة..."
          NEW_URLS=()
          for id in "${NEW_IDS[@]}"; do
            url=$(get_db_url "$NEW_TOKEN" "$id")
            NEW_URLS+=("$url")
            echo "✅ رابط قاعدة البيانات الجديدة: $url"
          done

          # نقل البيانات
          echo "🔄 بدء نقل البيانات..."
          pg_dump --clean --if-exists --no-owner --no-privileges "$OLD_URL1" > dump1.sql
          psql "${NEW_URLS[0]}" < dump1.sql
          echo "✅ تم نقل المشروع 1"

          pg_dump --clean --if-exists --no-owner --no-privileges "$OLD_URL2" > dump2.sql
          psql "${NEW_URLS[1]}" < dump2.sql
          echo "✅ تم نقل المشروع 2"

          pg_dump --clean --if-exists --no-owner --no-privileges "$OLD_URL3" > dump3.sql
          psql "${NEW_URLS[2]}" < dump3.sql
          echo "✅ تم نقل المشروع 3"

          echo "🎉 اكتمل النقل! المشاريع الجديدة:"
          for i in "${!NEW_IDS[@]}"; do
            echo "- مشروع ${i}: ID=${NEW_IDS[$i]} -> رابط: ${NEW_URLS[$i]}"
          done
