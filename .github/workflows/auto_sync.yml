name: Auto Sync All Railway PostgreSQL

on:
  schedule:
    - cron: '0 */12 * * *'      # كل 12 ساعة
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client curl jq

      - name: Get workspace ID and all PostgreSQL databases
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # جلب workspaceId من أول مساحة عمل
          WORKSPACE_ID=$(curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ me { workspaces { edges { node { id } } } } }"}' \
            https://backboard.railway.com/graphql/v2 | jq -r '.data.me.workspaces.edges[0].node.id')
          
          echo "Workspace ID: $WORKSPACE_ID"
          
          # جلب جميع المشاريع والخدمات
          QUERY='{
            "query": "query($workspaceId: String!) { workspace(id: $workspaceId) { projects { edges { node { id name services { edges { node { id name image plugin } } } } } } }",
            "variables": { "workspaceId": "'$WORKSPACE_ID'" }
          }'
          
          curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            https://backboard.railway.com/graphql/v2 > projects.json
          
          # تصفية PostgreSQL وجلب روابطها
          python3 << EOF
          import json, subprocess, os
          
          with open('projects.json') as f:
              data = json.load(f)
          
          dbs = []
          projects = data.get('data', {}).get('workspace', {}).get('projects', {}).get('edges', [])
          
          for proj in projects:
              project = proj.get('node', {})
              project_name = project.get('name')
              services = project.get('services', {}).get('edges', [])
              
              for svc in services:
                  service = svc.get('node', {})
                  if service.get('plugin') == 'postgresql' or 'postgres' in service.get('image', '').lower():
                      svc_id = service.get('id')
                      query2 = f'{{"query":"query {{ service(id: \\\"{svc_id}\\\") {{ variables {{ edges {{ node {{ name value }} }} }} }} }}"}}'
                      result = subprocess.run(
                          ['curl', '-s', '-H', f'Authorization: Bearer {os.environ["RAILWAY_TOKEN"]}',
                           '-H', 'Content-Type: application/json',
                           '-d', query2, 'https://backboard.railway.com/graphql/v2'],
                          capture_output=True, text=True
                      )
                      svc_data = json.loads(result.stdout)
                      vars_edges = svc_data.get('data', {}).get('service', {}).get('variables', {}).get('edges', [])
                      url = None
                      for var_edge in vars_edges:
                          var = var_edge.get('node', {})
                          if var.get('name') == 'DATABASE_PUBLIC_URL':
                              url = var.get('value')
                              break
                      if url:
                          dbs.append({
                              'project_name': project_name,
                              'service_name': service.get('name'),
                              'url': url
                          })
          
          with open('postgres_dbs.json', 'w') as f:
              json.dump(dbs, f, indent=2)
          
          print(f"Found {len(dbs)} PostgreSQL databases")
          EOF

      - name: Sync databases (first to second)
        run: |
          python3 << EOF
          import json, subprocess
          
          with open('postgres_dbs.json') as f:
              dbs = json.load(f)
          
          if len(dbs) < 2:
              print("Not enough databases to sync.")
              exit(0)
          
          src = dbs[0]
          tgt = dbs[1]
          
          print(f"Syncing from {src['project_name']}/{src['service_name']} to {tgt['project_name']}/{tgt['service_name']}")
          subprocess.run(f"pg_dump --clean --if-exists --no-owner --no-privileges '{src['url']}' > dump.sql", shell=True, check=True)
          subprocess.run(f"psql '{tgt['url']}' < dump.sql", shell=True, check=True)
          print("Sync completed.")
          EOF
